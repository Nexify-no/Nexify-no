# Nexify (Penna) — CI quality gate
# Add/replace at: .github/workflows/ci.yml
# (Needs a token WITH `workflow` scope, or add via the GitHub web UI.)
#
# Hard gate: nothing merges to `staging`/`main` unless this job is green.
# Make it enforced in Settings > Rules (ruleset already requires the `quality` check).

name: CI
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Ephemeral MySQL for the DB-backed integration tests. TiDB is MySQL-wire,
    # so migrations + queries run against plain MySQL 8 in CI.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: penna_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # No ssl param -> mysql2 connects without TLS (local CI DB).
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/penna_test"
      JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
      TOKEN_ENCRYPTION_KEY: "ci-test-token-encryption-key"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4   # version read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Frozen install is the lockfile-drift tripwire.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Apply Drizzle migrations to the ephemeral DB before tests run.
      - name: Run migrations
        run: pnpm exec drizzle-kit migrate

      - name: Typecheck
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Audit (prod deps)
        run: pnpm audit --prod --audit-level high
